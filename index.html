<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>yuri lover</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root {
  --background: #edf8f0;
  --surface: #f8fff9;
  --text: #26352b;
  --muted: #7d8981;
  --line: #cbd8ce;
  --green: #4ca875;
  --green-dark: #367b53;
  --red: #d94b55;
}

body.dark {
  --background: #111a15;
  --surface: #18231c;
  --text: #e5eee7;
  --muted: #849088;
  --line: #34443a;
  --green: #68c58e;
  --green-dark: #4eaa75;
  --red: #e45b64;
}

* { box-sizing: border-box; }

body {
  margin: 0;
  min-height: 100vh;
  background: var(--background);
  color: var(--text);
  font-family: "Montserrat", sans-serif;
  transition: background 0.25s ease, color 0.25s ease;
}

.page {
  width: min(900px, calc(100% - 40px));
  margin: auto;
  padding: 65px 0;
}

.top {
  display: flex;
  align-items: center;
  justify-content: space-between;
  width: 92%;
  margin: 0 auto;
}

.top-left {
  display: flex;
  align-items: baseline;
  gap: 10px;
}

.filename {
  margin: 0;
  color: var(--red);
  font-size: 42px;
  font-weight: 700;
  letter-spacing: -1.5px;
}

.subtitle {
  color: var(--muted);
  font-size: 13px;
  font-weight: 500;
}

.theme-button {
  padding: 7px 12px;
  border: 1px solid var(--line);
  border-radius: 4px;
  background: transparent;
  color: var(--muted);
  font-family: inherit;
  font-size: 11px;
  cursor: pointer;
}

.theme-button:hover {
  color: var(--green);
  border-color: var(--green);
}

.top-line {
  width: 92%;
  height: 1px;
  margin: 10px auto 90px;
  background: var(--line);
}

.message {
  width: 92%;
  max-width: 620px;
  margin: 0 auto;
}

.message p {
  margin: 0;
  font-size: 15px;
  line-height: 1.9;
}

.green {
  color: var(--green-dark);
  font-weight: 600;
}

.small {
  margin-top: 28px !important;
  color: var(--muted);
  font-size: 12px !important;
}

@media (max-width: 600px) {
  .page { width: calc(100% - 28px); padding: 45px 0; }
  .top { flex-direction: column; gap: 12px; }
  .filename { font-size: 32px; }
  .message { text-align: center; }
}
</style>
</head>
<body>

<div class="page">

  <header class="top">
    <div class="top-left">
      <h1 class="filename">index.html</h1>
      <span class="subtitle">by yuri lover</span>
    </div>
    <button class="theme-button" id="themeToggle">switch to dark</button>
  </header>

  <div class="top-line"></div>

  <div class="message">
    <p>
      The website is under development because I'm too busy holding
      <span class="green">Akogare no Maid-san wa Tabako ga Niau</span>
      with 2 hands, check back when I'm done.
    </p>
    <p class="small">One more chapter, trust.</p>
  </div>

</div>

<script>
  var body = document.body;
  var button = document.getElementById("themeToggle");

  function apply(dark) {
    body.classList.toggle("dark", dark);
    button.textContent = dark ? "switch to light" : "switch to dark";
  }

  var saved = null;
  try { saved = localStorage.getItem("theme"); } catch (e) {}
  apply(saved ? saved === "dark" : window.matchMedia("(prefers-color-scheme: dark)").matches);

  button.addEventListener("click", function () {
    var dark = !body.classList.contains("dark");
    apply(dark);
    try { localStorage.setItem("theme", dark ? "dark" : "light"); } catch (e) {}
  });
</script>

</body>
</html>
